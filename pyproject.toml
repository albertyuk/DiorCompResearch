[project]
name = "maison-monitor"
version = "0.1.0"
description = "Dior China competitive-intelligence monthly PPTX pipeline (Chanel / LV / Tiffany / Gucci / Fendi)"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5.0",
    "defusedxml>=0.7.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "playwright>=1.45",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pypinyin>=0.51",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "typer>=0.12",
    "itsdangerous>=2.1",
    "pillow-heif>=1.4.0",
]

[project.scripts]
mm = "mm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
