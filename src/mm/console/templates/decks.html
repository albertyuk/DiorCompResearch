{% extends "base.html" %}
{% set active = 'decks' %}
{% block title %}Decks{% endblock %}
{% block content %}
<h2>Deck archive</h2>
{% if not files %}<p class="note">Nothing rendered yet.</p>{% endif %}
<table class="grid" style="max-width:820px">
  <tr><th>File</th><th style="width:90px">Size</th><th style="width:130px"></th></tr>
  {% for f in files %}
  <tr>
    <td>{{ f.name }}</td>
    <td class="micro">{{ f.size_mb }} MB</td>
    <td><a class="btn" href="/download/{{ f.name }}">Download</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
